          - heading "부산영상위원회, 한-아세안 영화협력 새 장 연다…‘FLY PLUS’ 출범!" [level=2] [ref=f7e207]
          - paragraph [ref=f7e208]: "부산영상위원회, 한아세안 영화협력새 장 연다…'FLY PLUS' 출범! 11년간 FLY 운영 성과 잇는 후속 협력사업 본격화 3년간 279만 달러 한아세안 협력기금 확보 국제공동제작 프로젝트 개발 FLY Creative Lab첫 참가 프로젝트 공모 진행 □ 부산영상위원회(운영위원장 강성규)가 한국과 아세안(동남아시아국가연합, ASEAN) 영화 협력을 한 단계 확장할 ‘20262028 한ASEAN 영화공동체 프로그램: FLY PLUS(이하 FLY PLUS)’를 본격 출범한다. ○ FLY PLUS는 부산광역시와 부산영상위원회가 공동 주최·주관하고, 한아세안 협력기금(ASEANKorea Cooperation Fund, AKCF)의 지원을 받아 3년간 총 279만 달러(한화 약 39억 원) 규모로 운영된다. ○ 기존 인재 양성 중심의 협력을 넘어 국제공동제작과 산업 네트워크 구축까지 아우르는 한아세안 대표 영화 협력 플랫폼으로 확대 추진될 예정이다.□ 부산영상위원회는 지난 2012년부터"
