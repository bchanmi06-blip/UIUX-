          - paragraph [ref=f7e176]: 축제의 열기를 산업의 기회로…부산영상위원회, 10월 국제행사 라인업 공개 10월 10일(토) ~13일(화), 2026 ACFM 공동부스 운영 글로벌 영화산업 주요 현안을 다루는 포럼 2건 개최 부산아시아영화학교, 12개국 17편 장편 프로젝트 첫선 □ 부산영상위원회(운영위원장 강성규)가 오는 10월 10일(토)부터 13일(화)까지 나흘간 부산 벡스코 제2전시장에서 열리는 부산국제영화제 공식 마켓인 ‘2026 아시아콘텐츠&필름마켓(Asian Contents & Film Market, 이하 ACFM)’에 참가해 공동부스를 중심으로 국내외 영화·영상산업 관계자 간 비즈니스와 네트워킹을 확대한다.□ 부산영상위원회는 아시아영상위원회네트워크(AFCNet), 부산아시아영화학교(AFiS), 영상산업센터(BVIC)와 함께 부산영상위원회 공동부스(#D6D9)를 운영한다. 부스에서는 부산과 아시아 각국의 영화·영상 산업 정보와 최신 동향을 공유하고, 국내외 영화인 간 실질적인 비즈니스와 교류를 지원한다
