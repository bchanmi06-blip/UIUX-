          - heading "부산영상위원회-직원 채용 공고" [level=2] [ref=f7e199]
          - paragraph [ref=f7e200]: "[사단법인 부산영상위원회 채용공고 제2026006] 부산영상위원회직원 채용 공고 (사)부산영상위원회는 국내 최초의 영화촬영 지원 전담기구로서 국내외 영화촬영·제작지원 및 영상산업 발전을 목적으로 사업을 추진하고 있는 기관입니다. 부산영상위원회에서는 함께 근무할 진취적이고 역량있는 인재를 모집하오니 많은 관심과 지원바랍니다. 1 채용분야 및 자격요건 채용부문 채용 인원 계약 기간 담당업무 자격요건 필수사항 우대사항 전산 정보 1명 2026.10.01.~ (정규직) 전산 시스템 유지 관리 전산 네트워크 유지 관리 개인정보보호 관리 전산 정보 유지 관리 경력자 (3년 이상) 정보처리기사,정보보안기사 네트워크관리사, 리눅스마스터 등 자격 보유 2 지원자격 ○ 채용부문별 지원 자격 채용부문 지원 자격 공통 ・오피스 프로그램(한글, 엑셀, 파"
