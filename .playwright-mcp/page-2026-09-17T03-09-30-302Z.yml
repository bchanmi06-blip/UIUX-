          - heading "부산영상위원회 신임 운영위원장 공개 모집" [level=2] [ref=f7e222]
          - paragraph [ref=f7e223]: 부산영상위원회 신임 운영위원장 공개 모집 9월 1일까지 접수…임기 2년·재위촉 가능□ 부산영상위원회가 부산 영화·영상산업의 미래를 이끌 전문성과 리더십을 갖춘 운영위원장을 공개 모집한다.□ 이번 공모는 오는 10월 강성규 현 운영위원장의 임기가 만료됨에 따라 차기 운영위원장을 선임하기 위해 추진된다. 임기는 위촉일로부터 2년이며, 재위촉할 수 있다. ○ 운영위원장은 부산영상위원회의 업무를 총괄하며 △부산 영화‧영상산업 발전을 위한 중‧장기 계획 수립 △영화‧영상물 제작 및 촬영유치‧지원 등 영화영상산업 진흥 및 지원 △지역사회, 유관기관, 국내외 영화‧영상 관계자 네트워크 구축 △영화·영상산업 관련 기업 유치 발굴 등 사무처 운영 전반을 책임진다.□ 지원 자격은 △급변하는 영상산업 트렌드에 대응할 수 있는 능력과 관련 분야의 풍부한 경험을 갖춘 자 △국내·외 영화·영상산업 종사자와의 폭넓은 소통과 협력으로 ‘글로벌 영화·영상 비즈니스 도시 부산’을 선도할 수 있는 역량을 보유한 자
