          - paragraph [ref=f7e192]: "2026 부산아시아영화학교한국문학번역원 협력 부산지역 영화자막번역 지원사업 공고 부산영상위원회가 운영 중인 부산아시아영화학교 한국문학번역원과의 협력을 통해, 부산지역에서 활동 중인 영화인, 영화학과 학생들이 제작한 장편영화들에 대한 외국어 자막번역을 아래와 같이 지원하고자 합니다. 많은 관심과 신청을 부탁드립니다.※ 본 사업은 한국문학번역원의 지원으로 진행되며, 한국문학번역원과의 협의 후, 선정작이 결정됨을 알려드립니다. ▶ 주관: 부산영상위원회, 부산아시아영화학교▶ 협력: 한국문학번역원▶ 지원대상: 부산지역 장편영화 (★ 후반작업(편집 및 사운드 믹싱)이 완료된 작품에 한함)▶ 신청자격: 아래 중 1에 해당하는 경우, 신청 가능 ① 공고일 이전 사업자등록증의 본사 사업장소재지가 부산으로 되어 있는 제작사 (사업자등록증 내 영상물 제작 관련 종목이 있어야 함) ② 공고일 이전 부산에 거주하고 있는 제작사 대표 또는 감독 ③ 공고일 이전 부산지역 대학교 재학생 및 졸업생▶ 지원"
